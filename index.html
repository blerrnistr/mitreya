<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Один день Митреи</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="book">
  <!-- ЛЕВАЯ СТРАНИЦА: сцена + HUD -->
  <section class="page page-left">
    <div class="stage">
      <div class="stage-frame"></div>
      <canvas id="sceneCanvas" width="880" height="620"></canvas>
      <img id="sceneArt" alt="">
    </div>

    <div class="hud">
      <div class="stat">
        <span class="stat-icon">⏳</span>
        <span class="stat-label">Время</span>
        <span class="stat-value" id="hudTime">5</span>
      </div>
      <div class="stat">
        <span class="stat-icon">🌿</span>
        <span class="stat-label">Силы</span>
        <span class="pips" id="pipsStr"></span>
      </div>
      <div class="stat">
        <span class="stat-icon">☀</span>
        <span class="stat-label">Тепло</span>
        <span class="pips" id="pipsWarm"></span>
      </div>
    </div>
  </section>

  <!-- КОРЕШОК -->
  <div class="spine" aria-hidden="true"></div>

  <!-- ПРАВАЯ СТРАНИЦА: текст -->
  <section class="page page-right">
    <div id="content"></div>
  </section>
</div>

<script src="game.js" defer></script>
</body>
</html>
