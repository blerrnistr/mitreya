<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Один день Митреи</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="journal">
  <!-- Кожаный корешок -->
  <div class="spine"></div>

  <div class="page">
    <!-- Сцена-иллюстрация -->
    <div class="stage">
      <div class="stage-frame"></div>
      <canvas id="sceneCanvas" width="880" height="300"></canvas>
      <img id="sceneArt" alt="">
    </div>

    <!-- HUD как stat block -->
    <div class="hud">
      <div class="stat">
        <span class="stat-icon">⏳</span>
        <span class="stat-label">Время</span>
        <span class="stat-value" id="hudTime">5</span>
      </div>
      <div class="stat">
        <span class="stat-icon">🌿</span>
        <span class="stat-label">Силы</span>
        <span class="pips" id="pipsStr"></span>
      </div>
      <div class="stat">
        <span class="stat-icon">☀</span>
        <span class="stat-label">Тепло</span>
        <span class="pips" id="pipsWarm"></span>
      </div>
    </div>

    <!-- Контент -->
    <div id="content"></div>
  </div>
</div>
<script src="game.js" defer></script>
</body>
</html>
