<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Один день Митреи</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <div class="stage">
    <canvas id="sceneCanvas" width="880" height="300"></canvas>
    <img id="sceneArt" alt="">
  </div>

  <div class="hud">
    <div><span>Время</span><b id="hudTime">5</b></div>
    <div><span>Силы</span><span class="meter"><i id="barStr" style="width:100%"></i></span></div>
    <div><span>Тепло</span><span class="meter warm"><i id="barWarm" style="width:50%"></i></span></div>
  </div>

  <div id="content"></div>
</div>
<script src="game.js" defer></script>
</body>
</html>
